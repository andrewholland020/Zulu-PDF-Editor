.top .btn{background:transparent;border-color:var(--navy-line);color:var(--navy-ink)}
.top .btn:hover{border-color:var(--navy-ink);background:rgba(255,255,255,.08)}
.top .btn.primary{background:var(--navy-ink);border-color:var(--navy-ink);color:var(--navy)}
.top .sep{background:var(--navy-line)}
.top .pill{background:rgba(255,255,255,.16);color:var(--navy-ink)}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--chrome);color:var(--ink);font-family:var(--ui);font-size:14px;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.app{height:100%;display:grid;grid-template-rows:auto auto auto minmax(0,1fr)}

/* top bar */
.top{display:flex;align-items:center;gap:12px;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--panel)}
.brand{display:flex;align-items:center;gap:8px;font-weight:600;letter-spacing:.01em;white-space:nowrap}
.brand .mark{width:26px;height:26px;border-radius:6px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--mono);font-size:13px}
.doc{min-width:0;flex:1;display:flex;align-items:center;gap:8px;color:var(--muted)}
.doc b{font-weight:500;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-weight:600;white-space:nowrap}
.acts{display:flex;gap:6px;align-items:center}
.btn{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:7px;border:1px solid var(--line);background:var(--panel);white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn:disabled{opacity:.4;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:500}
.btn.icon{padding:0;width:34px;justify-content:center}
.sep{width:1px;height:22px;background:var(--line)}

/* tools */
.tools{display:flex;gap:2px;align-items:stretch;overflow-x:auto;padding-block:6px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--chrome);scrollbar-width:thin}
.tool{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-width:58px;padding:6px 6px 5px;border-radius:7px;border:1px solid transparent;background:none;font-size:11.5px;color:var(--muted)}
.tool:hover{background:var(--panel);color:var(--ink)}
.tool.on{background:var(--accent-soft);color:var(--accent);border-color:color-mix(in srgb,var(--accent) 35%,transparent)}
.tgroup{display:flex;gap:2px;align-items:stretch}
.tlabel{writing-mode:vertical-rl;transform:rotate(180deg);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:0 2px 0 8px;border-left:1px solid var(--line);margin-left:6px;text-align:center}

/* properties */
.props{display:flex;align-items:center;gap:14px;flex-wrap:wrap;min-height:44px;padding-block:6px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--panel);border-bottom:1px solid var(--line);font-size:13px}
.props .ptitle{font-weight:600}
.props .hint{color:var(--muted)}
.pg{display:flex;align-items:center;gap:8px}
.pg label{display:flex;align-items:center;gap:6px;color:var(--muted)}
.props select,.props input[type=number],.props input[type=text]{height:30px;border:1px solid var(--line);border-radius:6px;background:var(--panel);padding:0 8px}
.props input[type=number]{width:64px}
.props input[type=text]{width:150px}
input[type=color]{width:30px;height:30px;padding:2px;border:1px solid var(--line);border-radius:6px;background:var(--panel)}
.tog{height:30px;min-width:30px;border:1px solid var(--line);border-radius:6px;background:var(--panel);font-weight:700}
.tog.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.sw{width:24px;height:24px;border-radius:50%;border:2px solid var(--panel);box-shadow:0 0 0 1px var(--line)}
.sw.on{box-shadow:0 0 0 2px var(--accent)}
.del{margin-left:auto;color:var(--danger)}

/* main */
main{display:grid;grid-template-columns:184px minmax(0,1fr);min-height:0}
aside{border-right:1px solid var(--line);background:var(--chrome);display:flex;flex-direction:column;min-height:0}
.sidehead{display:flex;align-items:center;justify-content:space-between;padding:10px 12px 6px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.sidehead button{border:0;background:none;color:var(--accent);font-size:12px;text-transform:none;letter-spacing:0;font-weight:500}
.selbar{display:flex;flex-wrap:wrap;gap:4px;align-items:center;padding:6px 10px;margin:0 8px 6px;border-radius:8px;background:var(--accent-soft);font-size:12px}
.selbar span{flex:1 1 100%;color:var(--accent);font-weight:600}
.selbar button{border:1px solid var(--line);background:var(--panel);border-radius:6px;height:28px;padding:0 8px;font-size:12px}
.thumbs{flex:1;overflow-y:auto;padding:4px 12px 12px;display:flex;flex-direction:column;gap:10px}
.th{position:relative;border-radius:8px;padding:6px;border:1.5px solid transparent;user-select:none;touch-action:pan-y}
.th:hover{background:var(--panel)}
.th.cur{border-color:color-mix(in srgb,var(--accent) 45%,transparent)}
.th.sel{background:var(--accent-soft)}
.th.drag{opacity:.4}
.th.dropb::before,.th.dropa::after{content:"";position:absolute;left:0;right:0;height:3px;border-radius:2px;background:var(--accent)}
.th.dropb::before{top:-7px}.th.dropa::after{bottom:-7px}
.thimg{height:132px;display:grid;place-items:center;cursor:grab}
.thimg canvas{box-shadow:var(--shadow);background:var(--paper);transition:transform .15s}
.thbar{display:flex;align-items:center;gap:4px;margin-top:6px;font-family:var(--mono);font-size:12px;color:var(--muted)}
.thbar .n{flex:1;text-align:center}
.thbar button{border:0;background:none;width:26px;height:26px;border-radius:5px;display:grid;place-items:center;color:var(--muted)}
.thbar button:hover{background:var(--chrome);color:var(--ink)}
.thbar input{width:16px;height:16px;accent-color:var(--accent);margin:0 5px}
.addpdf{margin:0 12px 12px;justify-content:center}

.desk{position:relative;overflow:auto;background:var(--desk);overscroll-behavior:contain}
.pages{display:flex;flex-direction:column;align-items:center;gap:22px;padding:24px 16px 96px;width:max-content;min-width:100%;box-sizing:border-box}
.pwrap{position:relative;flex:none}
.pbox{position:absolute;transform-origin:center center;background:var(--paper);box-shadow:var(--shadow)}
.pcanvas,.pcanvas canvas{position:absolute;inset:0;width:100%;height:100%}
.forms,.layer{position:absolute;inset:0}
.layer{pointer-events:none}
.layer>*{pointer-events:auto}
.plabel{position:absolute;left:0;bottom:-19px;font-family:var(--mono);font-size:11px;color:var(--muted)}
body:not(.t-select) .forms{pointer-events:none}
body:not(.t-select) .pbox{touch-action:none;cursor:crosshair}
body.t-text .pbox{cursor:text}

/* existing form widgets */
.fw{position:absolute;box-sizing:border-box;border:0;margin:0;padding:0 3px;background:rgba(37,99,235,.09);color:#111;border-radius:2px;outline-offset:0}
.fw:hover{background:rgba(37,99,235,.16)}
.fw:focus{outline:1.5px solid #2563eb;background:rgba(37,99,235,.05)}
textarea.fw{resize:none;line-height:1.2;padding-top:2px}
select.fw{padding:0 2px;appearance:auto}
.fw.cb,.fw.rb{display:grid;place-items:center;cursor:pointer;padding:0}
.fw.rb{border-radius:50%}
.fw.cb.on::after{content:"";width:62%;height:62%;background:#111;clip-path:polygon(14% 52%,0 66%,38% 100%,100% 22%,86% 8%,38% 72%)}
.fw.rb.on::after{content:"";width:50%;height:50%;border-radius:50%;background:#111}
.fw:disabled,.fw.ro{background:rgba(0,0,0,.04);cursor:not-allowed}

/* added items */
.ann{position:absolute;box-sizing:border-box;touch-action:none;cursor:move}
.ann.sel{outline:1.5px solid var(--accent);outline-offset:2px}
.ann.text{white-space:pre;line-height:1.2;min-width:6px;min-height:1.2em}
.ann.text:empty::before{content:"Type here";color:#9aa3a1}
.ann.text.editing{cursor:text;outline:1.5px dashed var(--accent);outline-offset:2px}
.ann.img img{width:100%;height:100%;display:block;pointer-events:none;user-select:none}
.ann.whiteout{background:#fff;box-shadow:0 0 0 .5px rgba(0,0,0,.08)}
.ann.highlight{mix-blend-mode:multiply;opacity:.42}
.ann.ellipse{border-radius:50%}
.ann.field{border:1.5px dashed var(--field);background:var(--field-soft);color:var(--field);font-size:11px;line-height:1;padding:2px 4px;overflow:hidden;white-space:nowrap;display:flex;align-items:center;gap:4px}
.ann.field.radio{border-radius:50%;padding:0;justify-content:center}
.ann.field.checkbox{padding:0;justify-content:center}
svg.ann{overflow:visible;pointer-events:none;cursor:move}
svg.ann .hit{pointer-events:stroke;stroke:transparent}
svg.ann.sel{outline:none}
svg.ann.sel .vis{filter:drop-shadow(0 0 2px var(--accent))}
.hd{position:absolute;width:12px;height:12px;border-radius:3px;background:var(--panel);border:2px solid var(--accent);box-sizing:border-box;touch-action:none;z-index:2}
.hd.br{right:-8px;bottom:-8px;cursor:nwse-resize}
.hd.pt{transform:translate(-50%,-50%);border-radius:50%;cursor:grab}
.hd.tx{transform:translate(-50%,-50%)}
.hd.mv{width:22px;height:22px;border-radius:50%;background:var(--accent);border-color:var(--accent);color:var(--accent-ink);display:grid;place-items:center;cursor:move}
.hd.mv svg.i{width:14px;height:14px;stroke-width:2.2}
.hd.sz{cursor:nwse-resize}
@media (pointer:coarse){.hd{width:20px;height:20px}.hd.mv{width:30px;height:30px}}

/* floating zoom */
.zoom{position:absolute;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:2px;padding:4px;border-radius:10px;background:var(--panel);box-shadow:var(--shadow);border:1px solid var(--line);z-index:5}
.zoom button{width:32px;height:32px;border:0;background:none;border-radius:6px;display:grid;place-items:center}
.zoom button:hover{background:var(--chrome)}
.zoom .zv{font-family:var(--mono);font-size:12px;min-width:48px;text-align:center;font-variant-numeric:tabular-nums}
.zoom .pn{font-family:var(--mono);font-size:12px;color:var(--muted);padding:0 8px;border-right:1px solid var(--line);font-variant-numeric:tabular-nums}
.deskwrap{position:relative;min-height:0;display:grid}

/* modals & popovers */
.modal{position:fixed;inset:0;background:rgba(10,16,15,.45);display:grid;place-items:center;z-index:50;padding:16px}
.mbox{width:min(560px,100%);max-height:calc(100% - 32px);overflow:auto;background:var(--panel);border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.3);border:1px solid var(--line)}
.mhead{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 8px}
.mhead h2{margin:0;font-size:17px;font-weight:600}
.x{border:0;background:none;width:32px;height:32px;border-radius:6px;font-size:20px;color:var(--muted)}
.mbody{padding:4px 18px 8px;display:flex;flex-direction:column;gap:12px}
.mfoot{display:flex;flex-wrap:wrap;align-items:center;gap:10px;justify-content:flex-end;padding:12px 18px 16px;border-top:1px solid var(--line)}
.mfoot .grow{flex:1;display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:none;padding:8px 12px;border-bottom:2px solid transparent;color:var(--muted);margin-bottom:-1px}
.tabs button.on{color:var(--ink);border-color:var(--accent);font-weight:500}
.field{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted)}
.field input[type=text]{height:38px;border:1px solid var(--line);border-radius:7px;padding:0 10px;background:var(--panel);font-size:15px}
.styles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.styles button{height:72px;border:1.5px solid var(--line);border-radius:8px;background:#fff;color:#111;font-size:28px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;padding:0 10px}
.styles button.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.row.thick{justify-content:flex-start;gap:12px;color:var(--ink)}
.thick label{font-weight:500}
.thk{display:flex;align-items:center;gap:8px;flex:1;max-width:340px;color:var(--muted)}
.thk input{flex:1;accent-color:var(--accent)}
.thk output{font-family:var(--mono);font-size:12px;min-width:2ch;color:var(--ink)}
#sigPad{width:100%;height:190px;background:#fff;border:1.5px dashed var(--line);border-radius:8px;touch-action:none;cursor:crosshair;display:block}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted)}
.upprev{height:150px;border:1.5px dashed var(--line);border-radius:8px;display:grid;place-items:center;background:#fff;color:#6b7472;font-size:13px;overflow:hidden}
.upprev img{max-height:140px;max-width:95%}
.inks button{width:22px;height:22px;border-radius:50%;border:2px solid var(--panel);box-shadow:0 0 0 1px var(--line);vertical-align:middle}
.inks button.on{box-shadow:0 0 0 2px var(--accent)}
.pop{position:fixed;z-index:40;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:8px;width:240px;display:flex;flex-direction:column;gap:6px}
.pop .sig{position:relative;height:64px;border:1px solid var(--line);border-radius:7px;background:#fff;display:grid;place-items:center;padding:6px}
.pop .sig img{max-height:52px;max-width:100%}
.pop .sig .rm{position:absolute;top:2px;right:2px;width:22px;height:22px;border:0;border-radius:5px;background:rgba(0,0,0,.06);color:#333;font-size:14px;line-height:1}
.opt{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:8px;color:var(--ink)}
.opt input[type=radio]{margin-top:3px;accent-color:var(--accent)}
.opt small{display:block;color:var(--muted);margin-top:2px}
.opt input[type=text]{margin-top:8px;height:32px;border:1px solid var(--line);border-radius:6px;padding:0 8px;width:100%;box-sizing:border-box;background:var(--panel)}
.err{color:var(--danger);font-size:13px;min-height:1em}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:10px 16px;border-radius:8px;font-size:13px;z-index:60;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.toast.bad{background:var(--danger);color:#fff}
.busy{position:fixed;inset:0;background:rgba(10,16,15,.35);display:grid;place-items:center;z-index:70}
.busy div{background:var(--panel);padding:16px 22px;border-radius:10px;box-shadow:var(--shadow);display:flex;gap:12px;align-items:center}
.spin{width:18px;height:18px;border-radius:50%;border:2.5px solid var(--accent-soft);border-top-color:var(--accent);animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.drop{position:fixed;inset:0;z-index:80;background:rgba(10,16,15,.55);display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:32px}
.drop div{border:3px dashed rgba(255,255,255,.7);border-radius:16px;display:grid;place-items:center;color:#fff;font-size:20px;font-weight:600;text-align:center;padding:16px}
.drop div.hot{background:rgba(255,255,255,.12);border-color:#fff}
.drop small{display:block;font-weight:400;font-size:14px;opacity:.85;margin-top:6px}
.sidetoggle{display:none}
/* ---------- website views (home, tool pages, result) ---------- */
.site{height:100%;overflow-y:auto;background:var(--chrome)}
.snav{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:22px;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--panel);border-bottom:1px solid var(--line)}
.snav a{color:var(--muted);text-decoration:none;font-weight:500;white-space:nowrap}
.snav a:hover,.snav a.on{color:var(--ink)}
.snav .brand{color:var(--ink);font-size:16px}
.snav .links{display:flex;gap:20px;overflow-x:auto;scrollbar-width:none}
a.brand{color:inherit;text-decoration:none}
.wrapc{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hero{text-align:center;padding-block:52px 8px}
.hero .ic{width:52px;height:52px;border-radius:14px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;margin:0 auto 16px}
.hero .ic svg.i{width:26px;height:26px}
.hero h1{font-size:clamp(28px,5vw,44px);line-height:1.1;margin:0 0 12px;text-wrap:balance;font-weight:600;letter-spacing:-.015em}
.hero p{color:var(--muted);font-size:17px;line-height:1.5;margin:0 auto;max-width:58ch;text-wrap:balance}
.upload{margin:28px auto 0;max-width:640px;border:2px dashed var(--line);border-radius:16px;background:var(--panel);padding:34px 20px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.upload.hot{border-color:var(--accent);background:var(--accent-soft)}
.bigbtn{height:56px;padding:0 30px;font-size:17px;border-radius:10px;background:var(--accent);color:var(--accent-ink);border:0;font-weight:600;display:inline-flex;gap:10px;align-items:center;justify-content:center}
.bigbtn:hover{filter:brightness(1.06)}
.bigbtn:disabled{opacity:.45;cursor:default;filter:none}
.bigbtn svg.i{width:20px;height:20px}
.upload .or{color:var(--muted);font-size:14px}
.linkbtn{border:0;background:none;color:var(--accent);text-decoration:underline;text-underline-offset:2px;padding:0;font-size:14px}
.trust{display:flex;gap:8px 18px;justify-content:center;flex-wrap:wrap;color:var(--muted);font-size:13px;margin-top:14px}
.trust span{display:inline-flex;align-items:center;gap:6px}
.trust svg.i{width:15px;height:15px;color:var(--accent)}
.sec{padding-block:40px 0}
.sec>h2{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:0 0 12px;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.card{box-sizing:border-box;font:inherit;cursor:pointer;width:100%;display:flex;gap:14px;align-items:flex-start;padding:16px;border:1px solid var(--line);border-radius:12px;background:var(--panel);text-decoration:none;color:var(--ink);text-align:left}
.card:hover{border-color:var(--accent)}
.card .ci{width:40px;height:40px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.card b{display:block;font-weight:600;margin-bottom:3px}
.card span{color:var(--muted);font-size:13px;line-height:1.45}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;counter-reset:s;padding:0;margin:0;list-style:none}
.steps li{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px}
.steps li::before{counter-increment:s;content:counter(s);display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-family:var(--mono);font-size:13px;margin-bottom:10px}
.steps h3{margin:0 0 6px;font-size:15px;font-weight:600}
.steps p{margin:0;color:var(--muted);font-size:13.5px;line-height:1.5}
.foot{padding-block:48px 32px;color:var(--muted);font-size:13px;text-align:center}
.panel{box-sizing:border-box;max-width:680px;margin:24px auto 0;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:12px}
.panel .phead{display:flex;align-items:center;gap:12px}
.panel .phead b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.panel .phead span{color:var(--muted);font-size:13px}
.panel .phead .meta{flex:1;min-width:0}
.panel .go{align-self:center;margin-top:6px}
.flist{display:flex;flex-direction:column;gap:8px}
.fitem{display:flex;align-items:center;gap:12px;padding:10px 12px;background:var(--chrome);border:1px solid var(--line);border-radius:10px}
.fthumb{width:44px;height:56px;display:grid;place-items:center;flex:none}
.fthumb canvas{max-width:44px;max-height:56px;box-shadow:var(--shadow);background:#fff}
.fitem .meta{flex:1;min-width:0}
.fitem .meta b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.fitem .meta span{color:var(--muted);font-size:12.5px;font-family:var(--mono)}
.fitem button{border:0;background:none;width:32px;height:32px;border-radius:6px;display:grid;place-items:center;color:var(--muted)}
.fitem button:hover{background:var(--panel);color:var(--ink)}
.fitem button:disabled{opacity:.3}
.fitem .ord{font-family:var(--mono);color:var(--muted);width:20px;text-align:center}
.done .ic{background:var(--accent);color:var(--accent-ink)}
.filecard{display:flex;align-items:center;gap:12px;padding:14px;border:1px solid var(--line);border-radius:10px;background:var(--chrome)}
.filecard .ci{width:40px;height:48px;border-radius:6px;background:var(--panel);border:1px solid var(--line);display:grid;place-items:center;font-family:var(--mono);font-size:10px;color:var(--danger);font-weight:600;flex:none}
.filecard .meta{flex:1;min-width:0}
.filecard b{display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.filecard span{color:var(--muted);font-size:13px;font-family:var(--mono)}
.rowbtns{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.note{color:var(--muted);font-size:13px;text-align:center;margin:0}
@media (max-width:640px){.snav .links a:not(.on){display:none}.snav{gap:14px}.hero{padding-block:32px 4px}}
@media (max-width:820px){
  main{grid-template-columns:minmax(0,1fr)}
  aside{position:fixed;z-index:30;left:0;top:0;bottom:0;width:200px;box-shadow:var(--shadow);transform:translateX(-105%);transition:transform .2s;padding-top:env(safe-area-inset-top,0px)}
  aside.open{transform:none}
  .sidetoggle{display:inline-flex}
  .acts .lbl{display:none}
  .acts .btn{padding:0;width:34px;justify-content:center}
  .doc{display:none}
  .brand .nm{display:none}
  .top{justify-content:space-between}
  .zoom .pn{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation-duration:2s!important}}
</style>

<body>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<div class="site" id="vSite">
  <header class="snav">
    <a class="brand" href="#" data-go=""><span class="logo" aria-hidden="true"></span><span>Zulu PDF Editor</span></a>
    <nav class="links" aria-label="Tools">
      <a href="#edit-pdf" data-go="edit-pdf">Edit</a>
      <a href="#sign-pdf" data-go="sign-pdf">Fill &amp; Sign</a>
      <a href="#merge-pdf" data-go="merge-pdf">Merge</a>
      <a href="#split-pdf" data-go="split-pdf">Split</a>
      <a href="#organize-pdf" data-go="organize-pdf">Organize</a>
      <a href="#" data-go="">All tools</a>
    </nav>
  </header>
  <div id="siteMain"></div>
</div>

<div class="app" id="vEditor" hidden>
  <header class="top">
    <a class="brand" href="#" data-go="" title="All tools"><span class="logo" aria-hidden="true"></span><span class="nm">Zulu PDF Editor</span></a>
    <div class="doc"><b id="docName">Loading…</b><span class="pill" id="samplePill" hidden>Sample</span></div>
    <div class="acts">
      <button class="btn sidetoggle icon" id="sideBtn" title="Pages" data-ic="pages"></button>
      <button class="btn" id="openBtn" title="Open a PDF (replaces the current one)" data-ic="open"><span class="lbl">Open PDF</span></button>
      <button class="btn" id="addBtn" title="Add another PDF to the end (merge)" data-ic="merge"><span class="lbl">Merge</span></button>
      <button class="btn" id="splitBtn" title="Split into several PDFs" data-ic="split"><span class="lbl">Split</span></button>
      <span class="sep"></span>
      <button class="btn icon" id="undoBtn" title="Undo (Ctrl+Z)" data-ic="undo" disabled></button>
      <button class="btn icon" id="redoBtn" title="Redo (Ctrl+Shift+Z)" data-ic="redo" disabled></button>
      <button class="btn primary" id="dlBtn" title="Save your changes and get the PDF" data-ic="check"><span class="lbl">Apply changes</span></button>
    </div>
  </header>

  <nav class="tools" id="tools" aria-label="Tools">
    <div class="tgroup">
      <button class="tool on" data-tool="select" data-ic="select" title="Select, move and fill (V)">Select</button>
      <button class="tool" data-tool="text" data-ic="text" title="Add text (T)">Text</button>
      <button class="tool" data-act="image" data-ic="image" title="Add an image">Image</button>
      <button class="tool" data-act="sign" data-ic="sign" id="signTool" title="Add your signature">Sign</button>
      <button class="tool" data-tool="whiteout" data-ic="whiteout" title="Cover an area with white">Whiteout</button>
      <button class="tool" data-tool="highlight" data-ic="highlight" title="Highlight an area">Highlight</button>
    </div>
    <span class="tlabel">Shapes</span>
    <div class="tgroup">
      <button class="tool" data-tool="rect" data-ic="rect" title="Rectangle">Box</button>
      <button class="tool" data-tool="ellipse" data-ic="ellipse" title="Ellipse">Circle</button>
      <button class="tool" data-tool="line" data-ic="line" title="Line">Line</button>
      <button class="tool" data-tool="arrow" data-ic="arrow" title="Arrow">Arrow</button>
    </div>
    <span class="tlabel">Form</span>
    <div class="tgroup">
      <button class="tool" data-tool="f-text" data-ic="ftext" title="New text field">Text field</button>
      <button class="tool" data-tool="f-multiline" data-ic="fmulti" title="New paragraph field">Paragraph</button>
      <button class="tool" data-tool="f-checkbox" data-ic="fcheck" title="New checkbox">Checkbox</button>
      <button class="tool" data-tool="f-radio" data-ic="fradio" title="New radio choice">Radio</button>
      <button class="tool" data-tool="f-dropdown" data-ic="fdrop" title="New dropdown">Dropdown</button>
    </div>
  </nav>

  <div class="props" id="props">
    <span class="ptitle" id="ptitle">Select</span>
    <div class="pg" data-g="text" hidden>
      <select id="pFont" aria-label="Font"><option value="Helvetica">Helvetica</option><option value="Times">Times</option><option value="Courier">Courier</option></select>
      <button class="tog" id="pSmaller" title="Smaller text" aria-label="Smaller text">A−</button><input type="number" id="pSize" min="4" max="144" step="1" aria-label="Font size"><button class="tog" id="pBigger" title="Bigger text" aria-label="Bigger text">A+</button>
      <button class="tog" id="pBold" title="Bold">B</button>
      <input type="color" id="pColor" aria-label="Text color">
    </div>

/* ---------- state ---------- */

const snap = () => JSON.stringify({pages: S.pages, values: S.values, docName: S.docName, sample: S.sample});

async function pdfjsOpen(bytes) {

    const pg = await pdf.getPage(i + 1);

    return {vp: pg.getViewport({scale: 1}), anns};
  }));

/* ---------- rendering pages ---------- */

/* ---------- existing form fields ---------- */
function renderForms(p, host) {

      e = el(w.kind === "text" ? "input" : "textarea", "fw"); if (w.kind === "text") e.type = "text";

      e.addEventListener("input", () => setVal(p.src, w.name, e.value, e));
      e.addEventListener("change", () => { if (b0) { pushHist(b0); b0 = snap(); } });

async function buildDoc(pages) {

  const cp = {};
  for (const sid in docs) {
    const list = pages.filter(p => p.src === sid);
    const copied = await out.copyPages(docs[sid], list.map(p => p.idx));
    list.forEach((p, i) => cp[p.id] = copied[i]);

  pages.forEach(p => out.addPage(cp[p.id]));

}

  try {
    if (mode === "each") groups = S.pages.map((_, i) => [i]);
    else if (mode === "ranges") groups = parseRanges($("#splitRanges").value, n);
    else { const k = parseInt($("#splitN").value, 10); if (!(k >= 1)) throw new Error("Enter how many pages each file should have."); groups = []; for (let i = 0; i < n; i += k) groups.push(Array.from({length: Math.min(k, n - i)}, (_, j) => i + j)); }
  } catch (e) { $("#splitErr").textContent = e.message; return; }
  const back = splitFromEditor;
  await runExport(async full => {
    if (groups.length === 1) {
      const d = await subDoc(full, groups[0]);
      showResult({name: `${S.docName}-pages-${rangeLabel(groups[0])}.pdf`, data: await saveDoc(d), back}); return;
    }
    const zip = new JSZip();
    for (let g = 0; g < groups.length; g++) {
      busy(`Splitting… ${g + 1} of ${groups.length}`);
      zip.file(`${S.docName}-${String(g + 1).padStart(String(groups.length).length, "0")}-pages-${rangeLabel(groups[g])}.pdf`, await saveDoc(await subDoc(full, groups[g])));
    }
    busy("Packing the .zip…");
    showResult({name: `${S.docName}-split.zip`, data: await zip.generateAsync({type: "uint8array"}), zip: true, back, info: `${groups.length} PDFs, packed together in one .zip file.`});
  });
}

/* result */
function showResult(r) { lastResult = r; go("result"); }
function renderResult() {
  const r = lastResult, size = r.data.byteLength ?? r.data.size;
  const cont = r.zip ? "" : `<section class="sec"><h2>Continue with this PDF</h2><div class="grid">${["sign-pdf", "edit-pdf", "merge-pdf", "split-pdf"].map(id => { const t = TOOLS[id]; return `<button class="card" data-act="continue" data-tool="${id}"><span class="ci">${icon(t.ic)}</span><span><b>${t.name}</b><span>${t.card}</span></span></button>`; }).join("")}</div></section>`;
  showSite(`<div class="wrapc">
    <div class="hero done"><div class="ic">${icon("check")}</div><h1>${r.zip ? "Your files are ready" : "Your PDF is ready"}</h1><p>${esc(r.info || "Download it below. Your original file has not been changed.")}</p></div>
    <div class="panel">
      <div class="filecard"><span class="ci">${r.zip ? "ZIP" : "PDF"}</span><span class="meta"><b>${esc(r.name)}</b><span>${fmtSize(size)}</span></span></div>
      <button class="bigbtn go" data-act="download">${icon("download")}Download</button>
      <div class="rowbtns">${r.back ? `<button class="btn" data-act="back">${icon("undo")}${r.backLabel || "Back to editing"}</button>` : ""}<button class="btn" data-act="restart">${icon("plus")}Start over</button></div>
    </div>${cont}
    <div class="foot">Zulu PDF Editor runs entirely in your browser. Your PDFs are never uploaded to a server.</div></div>`, null);
}
function backToEditor() {
  if (!S.pages.length) { go(""); return; }
  showEditor(); if (lastResult && lastResult.fit) { S.zoom = fitZoom(); lastResult.fit = false; }
  renderAll(); showProps(); go("editor");
}

$("#siteMain").addEventListener("click", async e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const act = b.dataset.act, i = +b.dataset.i;
  if (act === "pick") { fSite.multiple = !!(TOOLS[curTool] || {}).multi; fSite.click(); }
  else if (act === "sample") {
    busy("Opening the sample…"); const f = new File([await makeSample()], "rental-application-sample.pdf", {type: "application/pdf"}); busy(false);
    handleUpload([f]);
  }
  else if (act === "mup" && i > 0) { [mergeList[i - 1], mergeList[i]] = [mergeList[i], mergeList[i - 1]]; renderTool("merge-pdf"); }
  else if (act === "mdown" && i < mergeList.length - 1) { [mergeList[i + 1], mergeList[i]] = [mergeList[i], mergeList[i + 1]]; renderTool("merge-pdf"); }
  else if (act === "mrm") { mergeList.splice(i, 1); renderTool("merge-pdf"); }
  else if (act === "merge") doMerge();
  else if (act === "split") doSplit();
  else if (act === "download") saveFile(lastResult.name, lastResult.data);
  else if (act === "back" || act === "toeditor") backToEditor();
  else if (act === "restart") go("");
  else if (act === "continue") {
    const r = lastResult, f = new File([r.data], r.name, {type: "application/pdf"}), id = b.dataset.tool;
    goThen(id, () => { mergeList = []; splitHasDoc = false; splitFromEditor = false; curTool = id; handleUpload([f]); });
  }
});
$("#siteMain").addEventListener("focusin", e => {
  if (e.target.id === "splitRanges") $("input[name=sm][value=ranges]").checked = true;
  if (e.target.id === "splitN") $("input[name=sm][value=every]").checked = true;
});

/* ---------- file inputs, drop, keys ---------- */
$("#openBtn").addEventListener("click", () => $("#fOpen").click());
$("#addBtn").addEventListener("click", () => $("#fAdd").click());
$("#addBtn2").addEventListener("click", () => $("#fAdd").click());
$("#fOpen").addEventListener("change", e => { const f = [...e.target.files]; e.target.value = ""; if (f.length) openFiles(f, "replace"); });
$("#fAdd").addEventListener("change", e => { const f = [...e.target.files]; e.target.value = ""; if (f.length) openFiles(f, "append"); });
$("#sideBtn").addEventListener("click", () => $("#side").classList.toggle("open"));
let dropEl = null, dragDepth = 0;
window.addEventListener("dragenter", e => {
  if (!e.dataTransfer || ![...e.dataTransfer.types].includes("Files")) return;
  e.preventDefault();
  if ($("#vEditor").hidden) { const u = $(".upload"); if (u) u.classList.add("hot"); return; }
  dragDepth++;
  if (!dropEl) {
    dropEl = el("div", "drop"); dropEl.innerHTML = `<div data-m="replace">Open this PDF<small>Replaces the current document</small></div><div data-m="append">Add to the end<small>Merges with the current document</small></div>`;
    document.body.append(dropEl);
  }
});
window.addEventListener("dragover", e => { if ($("#vEditor").hidden) { e.preventDefault(); return; } if (!dropEl) return; e.preventDefault(); $$("div[data-m]", dropEl).forEach(d => d.classList.toggle("hot", d.contains(e.target))); });
window.addEventListener("dragleave", e => { if ($("#vEditor").hidden) { if (!e.relatedTarget) { const u = $(".upload"); if (u) u.classList.remove("hot"); } return; } if (!dropEl) return; if (--dragDepth <= 0) { dropEl.remove(); dropEl = null; dragDepth = 0; } });
window.addEventListener("drop", e => {
  if ($("#vEditor").hidden) { e.preventDefault(); const u = $(".upload"); if (u) u.classList.remove("hot"); if (e.dataTransfer.files.length) handleUpload(e.dataTransfer.files); return; }
  if (!dropEl) return; e.preventDefault();
  const t = e.target.closest && e.target.closest("[data-m]"); const mode = t ? t.dataset.m : "replace";
  dropEl.remove(); dropEl = null; dragDepth = 0;
  if (e.dataTransfer.files.length) openFiles(e.dataTransfer.files, mode);
});
document.addEventListener("keydown", e => {
  const typing = e.target.closest && e.target.closest("input,textarea,select,[contenteditable=true]");
  const mod = e.ctrlKey || e.metaKey;
  if (mod && e.key.toLowerCase() === "z" && !typing) { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
  if (mod && e.key.toLowerCase() === "y" && !typing) { e.preventDefault(); redo(); return; }
  if ($("#vEditor").hidden) return;
  if (e.key === "Escape") { const m = $$(".modal").find(m => !m.hidden); if (m) { closeModal(m); return; } closePop(); if (S.sel) select(null); else setTool("select"); return; }
  if (typing || mod) return;
  if ((e.key === "Delete" || e.key === "Backspace") && S.sel) { e.preventDefault(); deleteSel(); }
  else if (e.key === "v" || e.key === "V") setTool("select");
  else if (e.key === "t" || e.key === "T") setTool("text");
});
$("#undoBtn").addEventListener("click", undo);
$("#redoBtn").addEventListener("click", redo);
let rsT; window.addEventListener("resize", () => { clearTimeout(rsT); rsT = setTimeout(() => { if (!$("#sigM").hidden && sig.tab === "draw") sizePad(); }, 150); });

/* ---------- sample document ---------- */
async function makeSample() {
  const d = await PL.PDFDocument.create(), H = await d.embedFont(PL.StandardFonts.Helvetica), HB = await d.embedFont(PL.StandardFonts.HelveticaBold);
  d.setTitle("Rental Application (sample)");
  const ink = PL.rgb(.08, .12, .12), mute = PL.rgb(.38, .43, .42), rule = PL.rgb(.82, .85, .9), teal = PL.rgb(.06, .15, .34);
  const form = d.getForm();
  const p1 = d.addPage([612, 792]);
  p1.drawRectangle({x: 0, y: 762, width: 612, height: 30, color: teal});
  p1.drawText("SAMPLE DOCUMENT  ·  open your own PDF to start editing", {x: 56, y: 773, size: 9, font: HB, color: PL.rgb(1, 1, 1)});
  p1.drawText("Harbor View Apartments", {x: 56, y: 722, size: 11, font: HB, color: teal});
  p1.drawText("Rental Application", {x: 56, y: 692, size: 26, font: HB, color: ink});
  p1.drawText("Please complete every section. Units available from 1 December 2026.", {x: 56, y: 670, size: 10.5, font: H, color: mute});
  p1.drawLine({start: {x: 56, y: 652}, end: {x: 556, y: 652}, thickness: 1, color: rule});
  const label = (t, x, y) => p1.drawText(t, {x, y, size: 9, font: HB, color: mute});
  const tf = (name, x, y, w, val) => { const f = form.createTextField(name); if (val) f.setText(val); f.addToPage(p1, {x, y, width: w, height: 20, borderWidth: 0, backgroundColor: PL.rgb(.96, .97, .97)}); f.setFontSize(10); p1.drawLine({start: {x, y}, end: {x: x + w, y}, thickness: .8, color: rule}); };
  label("FULL NAME", 56, 628); tf("full_name", 56, 604, 300, "");
  label("DATE OF BIRTH", 376, 628); tf("date_of_birth", 376, 604, 180, "");
  label("EMAIL", 56, 580); tf("email", 56, 556, 300, "");
  label("PHONE", 376, 580); tf("phone", 376, 556, 180, "");
  label("CURRENT ADDRESS", 56, 532); tf("current_address", 56, 508, 500, "");
  label("UNIT TYPE", 56, 482);
  const dd = form.createDropdown("unit_type"); dd.addOptions(["Studio", "1 Bedroom", "2 Bedroom", "3 Bedroom"]); dd.addToPage(p1, {x: 56, y: 458, width: 180, height: 20, borderColor: rule, borderWidth: 1}); dd.setFontSize(10);
  label("LEASE TERM", 260, 482);
  const rg = form.createRadioGroup("lease_term");
  rg.addOptionToPage("6 months", p1, {x: 260, y: 461, width: 12, height: 12, borderColor: mute, borderWidth: 1}); p1.drawText("6 months", {x: 278, y: 463, size: 10, font: H, color: ink});
  rg.addOptionToPage("12 months", p1, {x: 350, y: 461, width: 12, height: 12, borderColor: mute, borderWidth: 1}); p1.drawText("12 months", {x: 368, y: 463, size: 10, font: H, color: ink});
  const cb = form.createCheckBox("has_pets"); cb.addToPage(p1, {x: 56, y: 422, width: 12, height: 12, borderColor: mute, borderWidth: 1});
  p1.drawText("I have pets (a refundable pet deposit of $300 applies)", {x: 74, y: 424, size: 10, font: H, color: ink});
  label("ANYTHING ELSE WE SHOULD KNOW?", 56, 392);
  const nt = form.createTextField("notes"); nt.enableMultiline(); nt.addToPage(p1, {x: 56, y: 312, width: 500, height: 72, borderColor: rule, borderWidth: 1}); nt.setFontSize(10);
  p1.drawText("Declaration", {x: 56, y: 276, size: 12, font: HB, color: ink});
  const decl = "I confirm the information above is true and complete. I authorise Harbor View Apartments to verify my references and run a credit check.";
  wrap(decl, H, 10, 500).forEach((l, i) => p1.drawText(l, {x: 56, y: 258 - i * 14, size: 10, font: H, color: ink}));
  p1.drawLine({start: {x: 56, y: 180}, end: {x: 316, y: 180}, thickness: .8, color: ink});
  p1.drawText("Applicant signature", {x: 56, y: 166, size: 9, font: H, color: mute});
  p1.drawLine({start: {x: 376, y: 180}, end: {x: 556, y: 180}, thickness: .8, color: ink});
  p1.drawText("Date", {x: 376, y: 166, size: 9, font: H, color: mute});
  p1.drawText("Page 1 of 2", {x: 512, y: 40, size: 8, font: H, color: mute});
  const p2 = d.addPage([612, 792]);
  p2.drawText("Terms of tenancy", {x: 56, y: 722, size: 20, font: HB, color: ink});
  const terms = [
    ["1. Rent", "Rent is due on the first day of each month. A late fee of $50 applies after the fifth day."],
    ["2. Security deposit", "A deposit equal to one month of rent is held for the length of the lease and returned within 30 days of move-out, less any agreed deductions."],
    ["3. Maintenance", "Report repairs through the resident portal. Emergency repairs are handled within 24 hours."],
    ["4. Quiet hours", "Quiet hours run from 10 pm to 7 am every day. Please respect your neighbours."],
    ["5. Ending the lease", "Give at least 60 days of written notice before the end of the lease term."],
  ];
  let y = 684;
  for (const [h, t] of terms) { p2.drawText(h, {x: 56, y, size: 11.5, font: HB, color: ink}); y -= 17; for (const l of wrap(t, H, 10.5, 500)) { p2.drawText(l, {x: 56, y, size: 10.5, font: H, color: ink}); y -= 15; } y -= 14; }
  p2.drawText("Page 2 of 2", {x: 512, y: 40, size: 8, font: H, color: mute});
  return await d.save();
  function wrap(t, f, s, w) { const out = []; let line = ""; for (const word of t.split(" ")) { const tr = line ? line + " " + word : word; if (f.widthOfTextAtSize(tr, s) > w) { out.push(line); line = word; } else line = tr; } if (line) out.push(line); return out; }
}

(function start() {
  setTool("select");
  if (!PL || !pdfjs) { $("#siteMain").innerHTML = '<div class="wrapc hero"><h1>The PDF tools could not load</h1><p>Check your internet connection and reload the page.</p></div>'; return; }
  route();
})();
